apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment
  namespace: todo-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend
      
    spec:
      containers:
        - name: frontend
          image: denizhansan/todo-frontend:v3

          ports:
            - containerPort: 5500
          
