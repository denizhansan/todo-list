apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  namespace: todo-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: denizhansan/todo-backend:v2

          ports:
            - containerPort: 8000

          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: todo-app-secret
                  key: MONGO_DB_URI