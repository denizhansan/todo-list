apiVersion: networking.k8s.io/v1
kind: Ingress #Kullanmıyorum!!!

metadata:
  name: todo-app-ingress
  namespace: todo-app

spec:
  ingressClassName: nginx

  rules:
  - host: todo.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 5500

      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000