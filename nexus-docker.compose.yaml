services:
  nexus:
    image: sonatype/nexus3:latest
    container_name: todo-nexus

    restart: unless-stopped

    ports:
      - "8081:8081"
      - "8082:8082"

    volumes:
      - nexus-data:/nexus-data

    networks:
      - todo-network

volumes:
  nexus-data:

networks:
  todo-network:
    external: true