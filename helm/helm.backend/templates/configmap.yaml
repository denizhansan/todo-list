apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ .Values.configmap.name }}
  namespace: {{ .Values.namespace }}

data:
  DATABASE_NAME: {{ .Values.configmap.databaseName | quote }}
  COLLECTION_NAME: {{ .Values.configmap.collectionName | quote }}
  API_HOST: {{ .Values.configmap.apiHost | quote }}
  API_PORT: {{ .Values.configmap.apiPort | quote }}