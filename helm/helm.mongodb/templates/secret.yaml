apiVersion: v1
kind: Secret

metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Release.namespace }}

type: Opaque

stringData:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.secret.mongodb.username | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.secret.mongodb.password | quote }}
  MONGODB_URI: {{ .Values.secret.mongodb.uri | quote }}